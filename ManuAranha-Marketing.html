n('')}${[['Honorários','fees'],['Investimento total','total']].map(([n,k])=>`<tr><th>${n}</th>${totals.map(c=>`<th>${money(c[k])}</th>`).join('')}</tr>`).join('')}</tbody></table></div><div class="panel"><small>Total semestral com mídia</small><div class="total">${money(totals.reduce((a,c)=>a+c.total,0))}</div><div class="line">Honorários semestrais <b>${money(totals.reduce((a,c)=>a+c.fees,0))}</b></div>${months.map((m,i)=>`<div class="line">Mês ${i+1}<button onclick="current=${i};switchTab('budget')">Editar · ${money(totals[i].total)}</button></div>`).join('')}</div>`}if(tab==='proposal')$('proposal').innerHTML=`<div class="panel no-print"><label>Observações da proposta (opcional)<textarea class="obs-input" placeholder="Condições de pagamento, prazos ou orientações..." oninput="updateProposalNotes(this.value)">${esc(meta.observations||'')}</textarea></label></div><div class="actions no-print"><button class="primary" onclick="window.print()">Imprimir / salvar PDF</button><button onclick="switchTab('budget')">Voltar à seleção</button></div><div class="panel"><small>PROPOSTA COMERCIAL</small><h1>Marketing e comunicação integrada</h1><p>Cliente: ${esc(meta.client||'A definir')}<br>Responsável: ${esc(meta.author||'A definir')}<br>Validade: ${esc(meta.valid?meta.valid.split('-').reverse().join('/'):'A definir')}</p>${months.map((m,i)=>({m,i})).filter(({m})=>Object.values(m.q).some(Boolean)||m.media).map(({m,i})=>`<h2>Mês ${i+1}</h2><table><thead><tr><th>Serviço e escopo</th><th>Qtd.</th><th>Valor</th></tr></thead><tbody>${original.filter(s=>m.q[s.id]).map(s=>`<tr><td><b>${esc(s.name)}</b><br><small>${esc(s.desc)} · ${s.monthly?'Mensal':'Avulso'}</small></td><td>${m.q[s.id]}</td><td>${money(m.q[s.id]*prices[s.id])}</td></tr>`).join('')}</tbody></table>${summary(m)}`).join('')||'<p>Nenhum serviço selecionado.</p>'}<h2>Investimento consolidado</h2><div class="total">${money(months.reduce((a,m)=>a+calc(m).total,0))}</div><h3>Condições comerciais</h3><p>Até duas rodadas de ajustes. Entregas mensais não cumulativas. Domínio, hospedagem, impressão, ferramentas e mídia são custos externos. Verba de anúncios paga diretamente às plataformas. Gestão de tráfego considera mídia de até R$ 3.000/mês. Configurações dependem de acessos e elegibilidade. Valores a partir de sujeitos à confirmação. Sem garantia de posição no Google ou resultados comerciais. Serviços podem ser revistos mensalmente mediante aprovação.</p><div id="proposal-notes">${notesMarkup(meta.observations)}</div></div>`;bindDetails()}
function notesMarkup(value){return String(value||'').trim()?`<section class="obs-section"><h3>Observações</h3><p class="obs-text">${esc(String(value).trim())}</p></section>`:''}function updateProposalNotes(value){meta.observations=value;$('observations').value=value;persist();$('proposal-notes').innerHTML=notesMarkup(value)}function bindDetails(){document.querySelectorAll('details[data-cat]').forEach(d=>d.ontoggle=()=>{if(d.open)opened.add(d.dataset.cat);else opened.delete(d.dataset.cat)})}function refreshList(){ $('items').innerHTML=list(tab==='catalog');bindDetails()}function saveFile(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({prices,months,meta})],{type:'application/json'}));a.download='orcamento-marketing.json';a.click();URL.revokeObjectURL(a.href)}$('load').onchange=async e=>{try{restore(JSON.parse(await e.target.files[0].text()));persist();render()}catch(err){alert('Não foi possível abrir o orçamento.')}e.target.value=''};function resetAll(){if(confirm('Limpar os seis meses e os dados do cliente? Os preços editados serão mantidos.')){months=Array.from({length:6},()=>({q:{},media:0}));meta={client:'',author:'',valid:'',observations:''};for(let k in meta)$(k).value='';current=0;clearReceipt();persist();render()}}
const receiptFields=[['rProvider','Nome completo / razão social'],['rProviderDoc','CPF / CNPJ do prestador'],['rClient','Nome / razão social do contratante'],['rClientDoc','CPF / CNPJ do contratante'],['rNumber','Número do recibo'],['rReference','Mês / período de referência'],['rIssue','Data de emissão','date'],['rDue','Vencimento','date'],['rCity','Cidade / UF'],['rHolder','Titular da conta Pix'],['rBank','Instituição bancária'],['rPixType','Tipo de chave Pix','select'],['rPix','Chave Pix']];
function localDate(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function initReceipt(){ $('receipts').innerHTML=`<h2 class="no-print">Recibos</h2><div id="receipt-editor" class="panel no-print"><p class="muted">Preencha os dados apenas nesta sessão. Eles não são incluídos no armazenamento ou no arquivo JSON do orçamento.</p><form id="receipt-form" autocomplete="off"><h3>Importar serviços (opcional)</h3><div class="actions"><select id="rMonth" aria-label="Mês do orçamento">${months.map((_,i)=>`<option value="${i}">Mês ${i+1}</option>`).join('')}</select><button type="button" onclick="importReceipt()">Importar honorários do mês</button></div><small>A verba de anúncios não é importada, pois é paga diretamente às plataformas.</small><h3>Dados do documento</h3><div class="fields">${receiptFields.slice(0,9).map(receiptField).join('')}</div><h3>Serviços e valores</h3><div id="rRows"></div><button type="button" onclick="addReceiptRow()">+ Adicionar serviço</button><h3>Dados para pagamento via Pix</h3><div class="fields">${receiptFields.slice(9).map(receiptField).join('')}</div><label>Observações do recibo (opcional)<textarea id="rNotes" class="obs-input" autocomplete="off" placeholder="Condições de pagamento ou orientações acordadas..."></textarea></label><div class="actions"><button type="button" class="primary" onclick="downloadReceipt()">Baixar PDF</button><button type="submit">Imprimir</button><button type="button" onclick="if(confirm('Limpar todos os dados deste recibo?'))clearReceipt()">Limpar dados do recibo</button></div></form></div><div id="receipt-preview" class="panel receipt-paper"></div>`; $('receipt-form').addEventListener('input',refreshReceipt);$('rPixType').addEventListener('change',()=>{$('rPix').placeholder=({'CPF':'000.000.000-00','CNPJ':'00.000.000/0000-00','Telefone':'+55 (00) 00000-0000','E-mail':'email@exemplo.com','Chave aleatória':'Insira a chave aleatória'})[$('rPixType').value]||'';refreshReceipt()});$('receipt-form').addEventListener('submit',e=>{e.preventDefault();printReceipt()});clearReceipt();}
function receiptField([id,label,type]){if(type==='select')return `<label>${label}<select id="${id}" required style="display:block;width:100%;margin-top:5px"><option value="">Selecione</option>${['E-mail','CPF','CNPJ','Telefone','Chave aleatória'].map(x=>`<option>${x}</option>`).join('')}</select></label>`;return `<label>${label}<input id="${id}" type="${type||'text'}" autocomplete="off" ${['rProvider','rClient','rPix','rIssue'].includes(id)?'required':''}></label>`}
function addReceiptRow(name='',value=''){let row=document.createElement('div');row.className='receipt-row';row.innerHTML=`<input aria-label="Descrição do serviço" placeholder="Descrição do serviço" autocomplete="off" value="${esc(name)}"><input aria-label="Valor em reais" type="number" min="0" step="0.01" placeholder="R$" value="${esc(value)}"><button type="button" aria-label="Excluir serviço" onclick="this.parentElement.remove();refreshReceipt()">×</button>`;$('rRows').append(row);refreshReceipt()}
function receiptRows(){return Array.from($('rRows').children).map(r=>({name:r.children[0].value.trim(),value:Math.max(0,Number(r.children[1].value)||0)}))}
function clearReceipt(){if(!$('rRows'))return; $('receipt-form').reset();receiptFields.forEach(([id])=>$(id).value='');$('rIssue').value=localDate();$('rMonth').value=String(current);$('rRows').replaceChildren();addReceiptRow();}
function importReceipt(){let m=months[Number($('rMonth').value)];if(!original.some(s=>m.q[s.id])){alert('Nenhum serviço selecionado neste mês.');return}if(receiptRows().some(r=>r.name||r.value)&&!confirm('Substituir os serviços do recibo pelos honorários deste mês?'))return;$('rRows').replaceChildren();original.filter(s=>m.q[s.id]).forEach(s=>addReceiptRow(s.name+' — '+s.desc+(m.q[s.id]>1?' (Qtd. '+m.q[s.id]+')':''),Math.round(m.q[s.id]*prices[s.id]*100)/100));if(!$('rClient').value)$('rClient').value=meta.client;refreshReceipt()}
function refreshReceipt(){if(!$('receipt-preview'))return;let v=id=>esc($(id).value.trim()), date=id=>v(id).split('-').reverse().join('/'), rows=receiptRows().filter(r=>r.name||r.value),total=rows.reduce((a,r)=>a+Math.round(r.value*100),0)/100;let line=(label,val)=>val?`<p>${label}: ${val}</p>`:'';$('receipt-preview').innerHTML=`<div class="receipt-head"><small>MARKETING E COMUNICAÇÃO INTEGRADA</small><h2>Recibo de prestação de serviços</h2><div>Pagamento via Pix ${v('rNumber')?' · Nº '+v('rNumber'):''}</div></div><div class="fields"><div><small>PRESTADOR DE SERVIÇOS</small><p><b>${v('rProvider')||'Nome do prestador'}</b></p>${line('CPF/CNPJ',v('rProviderDoc'))}</div><div><small>CONTRATANTE</small><p><b>${v('rClient')||'Nome do contratante'}</b></p>${line('CPF/CNPJ',v('rClientDoc'))}</div></div><h3>Descrição dos serviços</h3><table><thead><tr><th>Serviço</th><th>Valor</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${money(r.value)}</td></tr>`).join('')||'<tr><td colspan="2">Nenhum serviço informado</td></tr>'}</tbody></table><div class="fields"><div>${line('Referência',v('rReference'))}</div><div>${line('Vencimento',date('rDue'))}</div></div><div class="receipt-total"><small>VALOR TOTAL</small><div class="total">${money(total)}</div></div><div class="pix-box" style="margin-top:16px"><b>Dados para pagamento via Pix</b>${line('Titular',v('rHolder')||v('rProvider'))}${line('Banco',v('rBank'))}${line('Chave Pix'+(v('rPixType')?' ('+v('rPixType')+')':''),v('rPix'))}</div><p class="muted" style="font-size:12px">Documento referente aos serviços discriminados acima. A quitação fica condicionada à efetivação do pagamento, mediante comprovante bancário. Não substitui nota fiscal quando obrigatória.</p><p style="text-align:center">${[v('rCity'),date('rIssue')].filter(Boolean).join(' — ')}</p>${notesMarkup($('rNotes').value)}`}
function printReceipt(){let rows=receiptRows().filter(r=>r.name||r.value);if(!rows.length||rows.some(r=>!r.name)||rows.reduce((a,r)=>a+r.value,0)<=0){alert('Informe a descrição dos serviços e um valor total positivo.');return}refreshReceipt();document.body.classList.add('print-receipt');window.print()}

function downloadReceipt(){
 if(!$('receipt-form').reportValidity())return;
 const rows=receiptRows().filter(r=>r.name||r.value);if(!rows.length||rows.some(r=>!r.name)||rows.reduce((a,r)=>a+r.value,0)<=0){alert('Informe os serviços e um valor total positivo.');return;}
 const v=id=>$(id).value.trim(), date=id=>v(id).split('-').reverse().join('/');
 const pages=[];let cmds=[],y=794;const left=43,right=552,ink='0.08 0.18 0.22',green='0 0.48 0.45',gray='0.35 0.43 0.45';
 const cv=document.createElement('canvas').getContext('2d');
 function width(t,size,bold=false){cv.font=`${bold?'bold ':''}${size}px Arial`;return cv.measureText(t).width;}
 function hex(t){const special={'€':128,'–':150,'—':151,'‘':145,'’':146,'“':147,'”':148,'…':133};return Array.from(String(t)).map(c=>(special[c]|| (c.charCodeAt(0)<=255?c.charCodeAt(0):63)).toString(16).padStart(2,'0')).join('');}
 function txt(t,x,yy,size=10,bold=false,color=ink){cmds.push(`BT /${bold?'F2':'F1'} ${size} Tf ${color} rg 1 0 0 1 ${x.toFixed(2)} ${yy.toFixed(2)} Tm <${hex(t)}> Tj ET`);}
 function rule(yy){cmds.push(`0.82 0.87 0.86 RG 0.6 w ${left} ${yy} m ${right} ${yy} l S`);}
 function wrap(t,w,size=10,bold=false){let out=[],line='';for(const word of String(t).split(/\s+/)){let candidate=line?line+' '+word:word;if(width(candidate,size,bold)>w&&line){out.push(line);line='';}if(width(word,size,bold)>w){for(const c of word){if(width(line+c,size,bold)>w){out.push(line);line='';}line+=c;}}else line=line?line+' '+word:word;}if(line)out.push(line);return out;}
 function next(){pages.push(cmds.join('\n'));cmds=[];y=794;txt('Recibo de prestação de serviços · continuação',left,y,12,true);y-=25;}
 function ensure(h){if(y-h<43)next();}
 function para(t,size=10,bold=false,color=ink){for(const l of wrap(t,right-left,size,bold)){ensure(size+4);txt(l,left,y,size,bold,color);y-=size+4;}}
 txt('MARKETING E COMUNICAÇÃO INTEGRADA',left,y,10,false,green);y-=23;txt('Recibo de prestação de serviços',left,y,20,true);y-=19;para('Pagamento via Pix'+(v('rNumber')?' · Nº '+v('rNumber'):''));rule(y);y-=20;
 let top=y;const parties=[[left,'PRESTADOR DE SERVIÇOS',v('rProvider'),v('rProviderDoc')],[305,'CONTRATANTE',v('rClient'),v('rClientDoc')]];let bottoms=[];for(const [x,label,name,doc] of parties){let yy=top;txt(label,x,yy,9,false,gray);yy-=17;for(const l of wrap(name,235,10,true)){txt(l,x,yy,10,true);yy-=14;}if(doc){for(const l of wrap('CPF/CNPJ: '+doc,235)){txt(l,x,yy);yy-=14;}}bottoms.push(yy);}y=Math.min(...bottoms)-12;
 para('Descrição dos serviços',12,true);y-=4;function tableHead(){txt('Serviço',left+4,y,10,true);txt('Valor',right-30,y,10,true);y-=9;rule(y);y-=13;}tableHead();
 for(const r of rows){const lines=wrap(r.name,390);let amount=money(r.value).replace(/\u00a0/g,' ');for(let i=0;i<lines.length;i++){if(y<65){next();tableHead();}txt(lines[i],left+4,y);if(i===0)txt(amount,right-4-width(amount,10),y);y-=13;}y-=3;rule(y);y-=13;}
 ensure(170);if(v('rReference'))para('Referência: '+v('rReference'));if(v('rDue'))para('Vencimento: '+date('rDue'));y-=8;txt('VALOR TOTAL',right-75,y,9,false,gray);y-=24;let total=money(rows.reduce((a,r)=>a+Math.round(r.value*100),0)/100).replace(/\u00a0/g,' ');txt(total,right-width(total,22,true),y,22,true,green);y-=24;rule(y);y-=19;
 para('Dados para pagamento via Pix',12,true);para('Titular: '+(v('rHolder')||v('rProvider')));if(v('rBank'))para('Banco: '+v('rBank'));para('Chave Pix ('+v('rPixType')+'): '+v('rPix'));y-=8;para('Documento referente aos serviços discriminados acima. A quitação fica condicionada à efetivação do pagamento, mediante comprovante bancário. Não substitui nota fiscal quando obrigatória.',9,false,gray);y-=8;para([v('rCity'),date('rIssue')].filter(Boolean).join(' — '));if(v('rNotes')){ensure(42);y-=8;para('Observações',12,true);for(const line of v('rNotes').split(/\r?\n/)){if(line.trim())para(line);else{ensure(10);y-=10;}}}pages.push(cmds.join('\n'));
 let objs=['<< /Type /Catalog /Pages 2 0 R >>','', '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>'];let kids=[];for(const stream of pages){let id=objs.length+1;kids.push(id+' 0 R');objs.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${id+1} 0 R >>`,`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);}objs[1]=`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${kids.length} >>`;let pdf='%PDF-1.4\n', offsets=[0];objs.forEach((o,i)=>{offsets.push(pdf.length);pdf+=`${i+1} 0 obj\n${o}\nendobj\n`;});let start=pdf.length;pdf+=`xref\n0 ${offsets.length}\n0000000000 65535 f \n`+offsets.slice(1).map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${offsets.length} /Root 1 0 R >>\nstartxref\n${start}\n%%EOF`;let url=URL.createObjectURL(new Blob([pdf],{type:'application/pdf'}));let a=document.createElement('a');a.href=url;a.download='Recibo-'+(v('rNumber')||'servicos').replace(/[^a-zA-Z0-9_-]/g,'-')+'.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);
}

window.addEventListener('afterprint',()=>document.body.classList.remove('print-receipt'));window.addEventListener('beforeprint',()=>document.body.classList.toggle('print-receipt',tab==='receipts'));initReceipt();render();
